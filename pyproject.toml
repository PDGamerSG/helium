[project]
name = "helium-workspace"
version = "0.1.0"
description = "Helium: time-aware memory for teams and their agents on Neo4j"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv.workspace]
members = ["packages/hiveboard", "packages/ingest", "apps/api"]

[tool.uv.sources]
hiveboard = { workspace = true }
ingest = { workspace = true }

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/hiveboard/tests", "packages/ingest/tests", "apps/api/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# The port keeps the upstream implementation's established style; CI gates correctness-focused checks.
select = ["E9", "F"]
