[project]
name = "helium-api"
version = "0.1.0"
description = "Helium HTTP API and agent workers over the graph substrate"
requires-python = ">=3.12,<3.14"
dependencies = [
  "hiveboard",
  "ingest",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "openai>=1.40",
  "google-genai>=1.0",
  "neo4j>=5.28",
  "python-multipart>=0.0.9",
]

[tool.uv]
package = false
