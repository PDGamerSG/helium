[project]
name = "hiveboard"
version = "0.2.0"
description = "Helium graph memory substrate for agent teams on Neo4j"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "neo4j>=5.28",
  "pydantic>=2",
  "mcp>=1.2",
  "orjson>=3.9",
  "neo4j-graphrag>=1.4",
]

[project.scripts]
helium-mcp = "hiveboard.mcp_server:main"
helium-bench = "bench.harness:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hiveboard", "bench"]

[tool.hatch.build.targets.wheel.force-include]
"../../cypher" = "hiveboard/cypher"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "hiveboard/**/*.py" }, { file = "../../cypher/*.cypher" }]
